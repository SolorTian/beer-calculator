<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>火球祭 EDC 結帳訓練</title><style>body{margin:0;background:#20242b;color:white;font-family:system-ui}main{max-width:420px;margin:auto;padding:15px}.phone{border:9px solid #d6d6d6;border-radius:28px;overflow:hidden;min-height:590px;background:#080808}.bar{background:black;text-align:center;padding:14px}.body{padding:18px}.home{min-height:570px;padding:25px 18px;text-align:center;background:linear-gradient(145deg,#ff7334,#ef9bc5,#7e9dff,#5ad6e7)}.home h1{font-size:45px;font-weight:300}.tile{display:block;width:100%;padding:24px 12px;background:#fffe;color:#222;border:0;border-radius:15px;margin:18px 0;font-size:19px}.amt{text-align:right;font-size:42px;margin:30px 0}.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.keys button{background:#36383d;color:white;border:0;border-radius:50%;width:72px;height:72px;font-size:26px;margin:auto}.primary{width:100%;background:#ff9800;color:white;border:0;padding:18px;font-size:18px;margin-top:20px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}.options button{border:0;border-radius:10px;padding:30px 8px;font-size:18px;background:#eee}.input{width:95%;padding:13px;font-size:18px;margin:8px 0}.scan{border:4px solid #19b9c5;margin:35px auto;width:190px;height:190px;display:grid;place-items:center;font-size:65px;color:#19b9c5}.center{text-align:center;padding:20px}.white{background:white;color:#222;min-height:540px}.tip{background:#fff1c4;color:#493c17;border-radius:12px;padding:15px;margin:12px 0}.controls{display:flex;gap:10px}.controls button{flex:1;padding:12px;border-radius:9px;border:1px solid #888;background:#343944;color:white}.line{padding:17px;border-bottom:1px solid #bbb}.muted{color:#aab}.homebottom{display:flex;justify-content:space-around;margin-top:80px}.homebottom button{border:0;border-radius:10px;padding:12px}</style><main><div class="phone"><div class="bar">17:56 ▴ ▣　　ePay365　　Wi-Fi ▰</div><div id="s"></div></div><div class="tip" id="tip"></div><div class="controls"><button onclick="back()">← 上一步</button><button onclick="guide=!guide;render()">引導開關</button><button onclick="reset()">回首頁</button></div><p class="muted" style="font-size:12px;text-align:center">僅供模擬訓練，不會實際扣款、掃碼或列印</p></main><script>let page='home',amt='',method='',guide=true,stack=[],records=[],idx=0;let s=document.getElementById('s'),tip=document.getElementById('tip');function go(p){stack.push(page);page=p;render()}function back(){page=stack.pop()||'home';render()}function reset(){page='home';amt='';stack=[];render()}function b(t,f){return '<button class="primary" onclick="'+f+'">'+t+'</button>'}function header(t){return '<div class="bar"><span onclick="back()" style="float:left">‹</span>'+t+'</div>'}function num(n){amt=n==='AC'?'':n==='←'?amt.slice(0,-1):amt+n;render()}function finish(){records.unshift({amt,method});go('success')}function render(){let h='',t='';if(page==='home'){h='<div class="home"><small>11月14日 星期六</small><h1>17:56</h1><button class="tile" onclick="go(\'amount\')">💲　店家收款及電子發票</button><button class="tile">🎁　點數兌換及票券核銷</button><div class="homebottom"><button onclick="go(\'settings\')">⚙️ 設定</button><button onclick="go(\'records\')">🧾 交易明細</button></div></div>';t='點選「店家收款及電子發票」。'}if(page==='amount'){h=header('進行付款')+'<div class="body"><div>消費金額</div><div class="amt">'+(amt||0)+'</div><div class="keys">'+['1','2','3','4','5','6','7','8','9','AC','0','←'].map(x=>'<button onclick="num(\''+x+'\')">'+x+'</button>').join('')+'</div>'+b('進行收款','Number(amt)>0?go(\'method\'):alert(\'請輸入金額\')')+'</div>';t='輸入金額後按進行收款。'}if(page==='method'){h=header('進行付款')+'<div class="body"><div class="amt">NT$ '+amt+'</div><div class="options">'+[['💳 信用卡','card'],['🎫 電子票證','ticket'],['📱 行動支付','mobile'],['💵 現金支付','cash']].map(([x,y])=>'<button onclick="method=\''+x+'\';go(\''+(y==='ticket'||y==='mobile'?'invoice':'unsupported')+'\')">'+x+'</button>').join('')+'</div></div>';t='選擇電子票證或行動支付。'}if(page==='unsupported'){h=header('付款方式')+'<div class="center">此方式未包含在提供的操作手冊中。'+b('返回','back()')+'</div>';t='請練習手冊中的電子票證或行動支付。'}if(page==='invoice'){h=header(method)+'<div class="body"><div class="scan">⌗</div><p>先掃描發票載具或輸入統一編號</p><input class="input" placeholder="發票載具（選填）"><input class="input" inputmode="numeric" maxlength="8" placeholder="統一編號（選填）"><p class="muted">未輸入則列印紙本電子發票</p>'+b('付款','go(\'scan\')')+'</div>';t='先處理載具或統編，再按付款。'}if(page==='scan'){h=header(method)+'<div class="center"><div class="scan">'+(method.includes('電子')?'📶':'▦')+'</div><h3>'+(method.includes('電子')?'請感應電子票證':'請掃描客人付款 QR Code')+'</h3><p>NT$ '+amt+'</p>'+b('模擬感應／掃碼完成','go(\'print\')')+'</div>';t='等待感應或掃碼完成，此處點擊模擬。'}if(page==='print'){h=header('進行付款')+'<div class="center"><div class="scan">🖨️</div><h3>將列印顧客收據</h3><div class="controls"><button onclick="finish()">取消</button><button onclick="finish()">確認</button></div></div>';t='確認列印收據，或取消不列印。'}if(page==='success'){h='<div class="white center"><div style="font-size:80px;color:#1bb4c0">✓</div><h2>付款完成</h2><p>謝謝惠顧</p><div class="line">交易方式　'+method+'</div><div class="line">付款金額　NT$ '+amt+'</div>'+b('回主畫面','reset()')+'</div>';t='交易成功，返回主畫面準備下一筆。'}if(page==='records'){h=header('交易紀錄')+'<div class="white">'+(records.length?records.map((r,i)=>'<div class="line" onclick="idx='+i+';go(\'detail\')">'+r.method+'　NT$ '+r.amt+'　›</div>').join(''):'<div class="line">目前無模擬交易紀錄</div>')+'</div>';t='選擇交易紀錄，練習重印收據。'}if(page==='detail'){h=header('交易明細')+'<div class="white center"><h3>'+records[idx].method+'</h3><p>NT$ '+records[idx].amt+'</p>'+b('重印收據','alert(\'模擬重印完成\')')+'</div>';t='按重印收據。'}if(page==='settings'){h=header('設定')+'<div class="white"><div class="line" onclick="go(\'network\')">網路　›</div><div class="line" onclick="go(\'printer\')">列印　›</div></div>';t='可練習網路與列印設定。'}if(page==='network'){h=header('網路')+'<div class="white"><div class="line">無線網路 <input type="checkbox" checked></div><div class="line">行動網路 <input type="checkbox"></div></div>';t='選擇 Wi-Fi 或行動網路。'}if(page==='printer'){h=header('列印')+'<div class="white">'+['現金','行動支付','電子票證','信用卡'].map(x=>'<div class="line">'+x+'　商家聯 <input type="checkbox" checked> 顧客聯 <input type="checkbox" checked></div>').join('')+'<p class="line">電子發票一律列印</p></div>';t='若只需一聯，可關閉顧客聯。'}s.innerHTML=h;tip.style.display=guide?'block':'none';tip.textContent='操作提示：'+t}render();</script></html>
